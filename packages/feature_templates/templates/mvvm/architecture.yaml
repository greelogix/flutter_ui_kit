name: mvvm
display_name: MVVM
folders:
  - models
  - views
  - viewmodels
files:
  - path: models/{{feature_snake}}_model.dart
    template: model.dart.template
  - path: views/{{feature_snake}}_view.dart
    template: screen.dart.template
  - path: viewmodels/{{feature_snake}}_viewmodel.dart
    template: viewmodel.dart.template
