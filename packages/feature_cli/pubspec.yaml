name: feature_cli
description: CLI for Flutter Feature Kit — feature scaffolding for any architecture.
version: 0.2.0
homepage: https://github.com/greelogix/flutter_feature_kit
repository: https://github.com/greelogix/flutter_feature_kit/tree/main/packages/feature_cli
